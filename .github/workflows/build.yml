name: "C++ CI build"
run-name: ${{ github.actor }} executed build ${{ inputs.testname }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      testname:
        default: "manually"
        description: "build title"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    # Build inside an Alpine container: matches the OpenWrt/musl packaging
    # environment used by other repos (and sidesteps actions/checkout's glibc
    # node not running on musl by using docker run instead of container:).
    - name: make (Alpine)
      run: |
        docker run --rm -v "$PWD":/src -w /src alpine:edge sh -c '
          apk add --no-cache build-base linux-headers \
            gd-dev libdrm-dev libusb-compat-dev &&
          make
        '
